services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: staffing
      POSTGRES_USER: staffing
      POSTGRES_PASSWORD: staffing
    ports:
      - "5432:5432"
    volumes:
      - staffing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffing -d staffing"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://staffing:staffing@postgres:5432/staffing
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  staffing-postgres:
