name: Giveaway platform CI

on:
  pull_request:
    paths:
      - "projects/raffle-commerce-template/**"
      - ".github/workflows/giveaway-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/raffle-commerce-template/**"
      - ".github/workflows/giveaway-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giveaway-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/raffle-commerce-template

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./ci.db
      DEPLOYMENT_ENV: development
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-at-least-32-characters
      CRON_SECRET: ci-only-maintenance-secret-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      DEMO_MODE: "true"
      DEFAULT_TENANT_SLUG: northstar
      TRUST_PROXY_HEADERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/raffle-commerce-template/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:examples
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
